<html lang="en">

    <title>Coucou — Messages card preview</title>

      body { margin: 0; background: #1b1b1f; font: 12px system-ui; color: #ddd; }
      /* MESSAGES_OVERVIEW_H 240 minus the island header and insets: the card is 188 tall. */

               background: #5865f2; opacity: 0.85; z-index: 2; }
