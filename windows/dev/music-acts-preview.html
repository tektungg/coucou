<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Music Acts</title>
    <style>
      body { margin: 0; background: #0b0c0f; color: #ece9f5; font: 13px/1.4 "Segoe UI", system-ui, sans-serif; padding: 24px 16px; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      p.lead { color: #9a94ab; margin: 0 0 18px; max-width: 900px; }
      #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 14px; }
      .cell { background: #15131c; border: 1px solid #23202d; border-radius: 18px; padding: 12px; }
      .stage { display: flex; align-items: flex-end; gap: 12px; }
      .stage canvas { border-radius: 14px; background: radial-gradient(170px 110px at 50% 100%, #1f3a2a, #17151f 70%); }
      .island { padding: 6px; border-radius: 16px; background: #17151f; outline: 1px dashed #36314a; }
      .island small { display: block; text-align: center; color: #6e6782; font-size: 10.5px; margin-top: 2px; }
      .meta { margin-top: 10px; }
      .code { font: 700 11px "Cascadia Code", Consolas, monospace; color: #ff8fb1; }
      .meta b { font-size: 15px; margin-left: 8px; }
      .meta p { color: #9a94ab; margin: 3px 0 0; }
    </style>
  </head>
  <body>
    <h1>Music acts</h1>
    <p class="lead">The real Mochi (green, as on the Music pill) and the real act pipeline. Left: a roomy canvas. Right, dashed: the island's own bot canvas (Home's 58 px Mochi), where anything outside the canvas would be cut. The one-shots replay.</p>
    <div id="grid"></div>
    <script type="module" src="./music-acts/preview.ts"></script>
  </body>
</html>
